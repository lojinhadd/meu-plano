<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Plano">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<title>Meu Plano</title>
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#1b2226; --soft:#5d6870; --line:#dde3e0;
  --accent:#1f7a5a; --accent-ink:#ffffff; --accent-bg:#e5f2eb;
  --warn:#9a6212; --warn-bg:#fcf1dc; --over:#b4400d; --over-bg:#fce8de;
  --danger:#b3261e; --danger-bg:#fbeceb; --chip:#eef1f0; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111615; --card:#1b2220; --ink:#eef2f0; --soft:#a3aeaa; --line:#2c3532;
    --accent:#3fb489; --accent-ink:#0c1512; --accent-bg:#17342a;
    --warn:#e2b25a; --warn-bg:#3a2e17; --over:#f0875a; --over-bg:#3b2219;
    --danger:#f08a82; --danger-bg:#3b1d1b; --chip:#232b29; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.35;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:560px;margin:0 auto}
header.top h1{font-size:22px;margin:0;letter-spacing:-.2px}
.help-btn{background:var(--danger-bg);color:var(--danger);font-weight:700;font-size:15px;border-radius:999px;padding:9px 14px;min-height:44px}
.icon-btn{min-width:44px;min-height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:22px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 6px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.muted{color:var(--soft)}
.small{font-size:15px}
.tiny{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 2px}
.daynav .title{text-align:center}
.daynav .title b{display:block;font-size:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:14px;font-weight:600;background:var(--chip)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.warn{background:var(--warn-bg);color:var(--warn)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.check{display:flex;align-items:center;gap:12px;min-height:48px;width:100%;text-align:left}
.box{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--soft);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:18px;font-weight:800}
.check.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar{height:14px;background:var(--chip);border-radius:999px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over i{background:var(--over)}
.bar.low i{background:var(--warn)}
.barlabel{display:flex;justify-content:space-between;font-size:15px;margin:10px 0 4px}
.meal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:72px}
.meal .emo{font-size:30px;width:40px;text-align:center;flex:none}
.meal .nm{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.vazio{background:var(--chip);color:var(--soft)}
.chip.ok{background:var(--accent-bg);color:var(--accent)}
.chip.falta{background:var(--warn-bg);color:var(--warn)}
.chip.passou{background:var(--over-bg);color:var(--over)}
.chip.trocado{background:var(--chip);color:var(--soft)}
.note{font-size:14px;color:var(--soft);margin-top:2px}
.note.warn{color:var(--warn)}
.banner{border-radius:16px;padding:14px 16px;margin:10px 0;font-size:16px}
.banner.info{background:var(--accent-bg)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.over{background:var(--over-bg);color:var(--over)}
.oakbtn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;min-height:60px}
.oakbtn .emo{font-size:30px}
.plate{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:6px}
.plate.drag{border-color:var(--accent);background:var(--accent-bg)}
.item{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .emo{font-size:26px;width:34px;text-align:center}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:12px;background:var(--chip);font-size:24px;font-weight:700}
.qty b{min-width:34px;text-align:center;font-size:19px}
.sugs{display:grid;gap:10px}
.sug{border:2px solid var(--accent);border-radius:14px;padding:12px 14px;background:var(--card)}
.sug .emos{font-size:24px;letter-spacing:2px}
.sug .why{font-size:14px;color:var(--accent);font-weight:700;margin:4px 0 8px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;min-height:40px;padding:8px 14px;border-radius:999px;background:var(--chip);font-size:15px;font-weight:600}
.cats button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 10px 12px;text-align:left;min-height:112px;display:flex;flex-direction:column;gap:2px;position:relative;user-select:none;-webkit-user-select:none}
.food:active{transform:scale(.98)}
.food .emo{font-size:32px;line-height:1.1}
.food .fn{font-weight:700;font-size:16px}
.food .fp{font-size:13px;color:var(--soft)}
.food .tag{position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;background:var(--accent-bg);color:var(--accent);border-radius:999px;padding:2px 7px}
.food .cnt{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.presets{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.presets button{flex:none;min-height:44px;padding:8px 14px;border-radius:12px;background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--soft)}
nav.tabs button span{font-size:24px}
nav.tabs button.on{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field label{font-size:15px;color:var(--soft);font-weight:600}
.field input{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 14px;font-size:20px}
.list .li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .s{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .s b{display:block;font-size:26px}
.why-list .w{padding:12px 0;border-bottom:1px solid var(--line)}
.why-list .w:last-child{border-bottom:0}
.why-list .w b{display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:21px}
.sheet .acts{display:grid;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-size:16px;width:min(92vw,520px);box-shadow:0 4px 18px rgba(0,0,0,.2)}
.toast span{flex:1}
.toast button{color:var(--accent-bg);font-weight:800;min-height:40px;padding:0 8px;text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--accent);min-height:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg text{font-family:inherit}
.note16{font-size:16px;color:var(--soft);margin-top:4px}
.note16.warn{color:var(--warn)}
.search input{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 14px;font-size:18px}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 8px}
.size{border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:76px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font-size:16px}
.size b{font-size:20px}
.size.on{border-color:var(--accent);background:var(--accent-bg)}
.repeat{display:grid;gap:10px;margin:10px 0}
.dayrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:12px 4px;min-height:56px;border-bottom:1px solid var(--line);font-size:16px}
.onb-txt{font-size:20px;line-height:1.4;margin:6px 0 10px}
.onb-step{font-size:16px;color:var(--soft);font-weight:700;margin-bottom:6px}
.onb-cores{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.onb-cores .chip{font-size:16px}
</style>
</head>

const pad = n => String(n).padStart(2, "0");

const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);

const fmtShort = k => { const d = dateOf(k); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const n0 = x => Math.round(x).toLocaleString("pt-BR");

let memoryOnly = false;
function blank() { return {version: VERSION, start: todayKey(), days: {}, weights: []}; }
function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { memoryOnly = true; return blank(); }
  if (!raw) return blank();
  try {
    const d = JSON.parse(raw);
    if (d && d.version === VERSION && d.days && typeof d.days === "object") {
      d.weights = Array.isArray(d.weights) ? d.weights : [];
      if (d.settings !== undefined && (!d.settings || typeof d.settings !== "object" || Array.isArray(d.settings))) d.settings = {};
      return d;
    }
  } catch (e) {}
  // não reconheceu o que estava salvo: guarda uma cópia intacta antes de começar do zero (nunca some)
  try { localStorage.setItem(`${STORE_KEY}.recuperar-${keyOf(new Date())}`, raw); } catch (e) {}
  return blank();
}
const cfg = () => (data.settings && typeof data.settings === "object" ? data.settings : {});

/* ---------- contas ---------- */
function totalsOf(list) {
  let k = 0, p = 0;
  for (const it of list) { const f = FOOD[it.id]; if (!f) continue; k += f.k * it.q; p += f.p * it.q; }
  return {k, p};
}
/* Oakberry: o copo padrão é o tamanho escolhido + whey 28 g + morango (ou banana) */
function oakCupOf(list) { const it = list.find(i => OAK_CUPS.includes(i.id)); return it ? it.id : null; }
function oakPadrao(k) {
  const list = items(k, "lanche"), cup = oakCupOf(list) || "oak500";
  const ids = [cup, "oakwhey", list.some(i => i.id === "oakbanana") ? "oakbanana" : "oakmorango"];
  return {cup, k: ids.reduce((a, id) => a + FOOD[id].k, 0), p: ids.reduce((a, id) => a + FOOD[id].p, 0)};
}
const oakSemPao = k => dayObj(k).type === "oak" && oakPadrao(k).k > OAK_SEM_PAO;
function baseTarget(k, m) {
  const d = dayObj(k), b = MEAL[m];
  let t = {kMin: b.kMin, kMax: b.kMax, pMin: b.pMin, adj: 0, adjFrom: null, pBoost: false};
  if (d.type === "oak") {
    const pd = oakPadrao(k);
    if (m === "lanche") t = {...t, kMin: pd.k - 120, kMax: pd.k, pMin: 15};
    if (m === "doce") t = {...t, kMin: 0, kMax: 0, pMin: 0};
    if (m === "jantar" && pd.k > OAK_SEM_PAO) t = {...t, kMin: 280, kMax: 360, pMin: 25};
  }
  return t;
}
function targets(k) {
  const T = {};
  for (const m of MEALS) T[m.id] = baseTarget(k, m.id);
  // excesso das refeições já lançadas sai das que faltam (docinho, jantar, lanche)
  let over = 0, from = null;
  for (const m of MEALS) {
    const list = items(k, m.id);
    if (!list.length) continue;
    const t = totalsOf(list), x = t.k - T[m.id].kMax;
    if (x > 15) { over += x; from = from || m.nome; }
  }
  const floors = {doce: 0, jantar: 250, lanche: 150, almoco: 350, cafe: 250};
  for (const mid of ["doce", "jantar", "lanche", "almoco", "cafe"]) {
    if (over <= 0) break;
    if (items(k, mid).length) continue;
    const t = T[mid], cap = Math.max(0, t.kMax - floors[mid]);
    const cut = Math.min(cap, over);
    if (cut > 0) { t.kMax -= cut; t.kMin = Math.max(0, Math.min(t.kMin, t.kMax - 80)); t.adj = cut; t.adjFrom = from; over -= cut; }
  }
  // proteína do dia: se faltar, o jantar pede mais
  if (!items(k, "jantar").length) {
    let proj = 0;
    for (const m of MEALS) {
      if (m.id === "jantar") continue;
      const list = items(k, m.id);
      proj += list.length ? totalsOf(list).p : T[m.id].pMin;
    }
    const need = Math.min(45, DAY_PMIN - proj);
    if (need > T.jantar.pMin) { T.jantar.pMin = Math.ceil(need); T.jantar.pBoost = true; }
  }
  return T;
}
function status(k, m, T) {
  const list = items(k, m), d = dayObj(k), t = (T || targets(k))[m];
  if (d.type === "oak" && m === "doce" && !list.length) return {s: "trocado", txt: "trocado pelo açaí"};
  if (!list.length) return {s: "vazio", txt: "Ainda não lançou"};
  const tot = totalsOf(list);
  if (m === "doce") return tot.k <= t.kMax + 5 ? {s: "ok", txt: "ok"} : {s: "passou", txt: `passou ${n0(tot.k - t.kMax)} kcal`};
  if (d.type === "oak" && m === "lanche" && oakCupOf(list) && !list.some(i => i.id === "oakwhey" || i.id === "oakwhey14") && tot.p < t.pMin) return {s: "falta", txt: "sem proteína: peça whey"};
  if (tot.k > t.kMax + 15) return {s: "passou", txt: `passou ${n0(tot.k - t.kMax)} kcal`};
  if (tot.p < t.pMin - 0.5) return {s: "falta", txt: "falta proteína"};
  if (tot.k < t.kMin - 60) return {s: "falta", txt: "falta um pouco"};
  return {s: "ok", txt: "ok"};
}
function dayTotals(k) {
  let kk = 0, pp = 0;
  for (const m of MEALS) { const t = totalsOf(items(k, m.id)); kk += t.k; pp += t.p; }
  return {k: kk, p: pp};
}
function weekDays(k) { const s = weekStart(k); return [0,1,2,3,4,5,6].map(i => addDays(s, i)); }
function eggsInWeek(k, excludeMeal) {
  let n = 0;
  for (const dk of weekDays(k)) {
    const d = data.days[dk]; if (!d) continue;
    for (const [mid, list] of Object.entries(d.meals)) {
      if (dk === k && mid === excludeMeal) continue;
      for (const it of list) if (it.id === "ovo") n += it.q;
    }
  }
  return n;
}
function oakInWeek(k) { return weekDays(k).filter(dk => data.days[dk] && data.days[dk].type === "oak").length; }
function sucoToday(k) { let n = 0; for (const list of Object.values(dayObj(k).meals)) for (const it of list) if (FOOD[it.id] && FOOD[it.id].suco) n += it.q; return n; }

/* Mais usados: frequência nesta refeição (sem contar o dia aberto), pref como desempate */
function maisUsados(k, m) {
  const pref = MEAL[m].pref, c = {};
  for (const [dk, d] of Object.entries(data.days)) {
    if (dk === k || !d || !d.meals) continue;
    for (const it of d.meals[m] || []) if (FOOD[it.id]) c[it.id] = (c[it.id] || 0) + 1;
  }
  const pos = id => { const i = pref.indexOf(id); return i < 0 ? 1e3 : i; };
  return pref.concat(Object.keys(c).filter(id => !pref.includes(id)))
    .filter(id => FOOD[id] && FOOD[id].g !== "fora" && FOOD[id].g !== "oak")
    .sort((a, b) => ((c[b] || 0) - (c[a] || 0)) || (pos(a) - pos(b))).map(id => FOOD[id]);
}
/* busca: ignora acento e maiúscula ("pao" acha "Pão francês") */
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function searchFoods(q) {
  const ws = norm(q).split(/\s+/).filter(Boolean);
  return CATALOG.filter(f => f.g !== "oak" && ws.every(w => norm(f.nome).includes(w)));
}
/* repetir refeição: itens daquela refeição em outro dia (açaí só entra no lanche de dia de Oakberry) */
function copyItens(src, k, m) {
  const oakOk = dayObj(k).type === "oak" && m === "lanche";
  return items(src, m).filter(i => oakOk || FOOD[i.id].g !== "oak").map(i => [i.id, i.q]);
}
/* lembrete de cópia de segurança */
const hasRecords = d => !!d && (Object.values(d.meals || {}).some(l => Array.isArray(l) && l.length) || !!(d.treino || d.cam1 || d.cam2));
function backupDue(k) {
  const rec = Object.keys(data.days).filter(dk => hasRecords(data.days[dk])).sort();
  if (rec.length < 3) return false;
  return diffDays(cfg().lastBackup || rec[0], k) >= 7;
}

    if (!list.some(i => i.id === "oakwhey" || i.id === "oakwhey14")) return {msg: "O açaí sozinho não tem proteína.", opts: [{itens: [["oakwhey", 1]], why: "whey no açaí: +20 g de proteína"}]};
    return {msg: null, opts: []};
  }
  if (m === "doce") {
    if (d.type === "oak") return {msg: null, opts: []};
    if (list.length) return {msg: null, opts: []};
    return {msg: "Um docinho de até ~110 kcal, no lugar da fruta.", opts: [["pacoca"],["bombom"],["doceleite"]].map(([id]) => ({itens: [[id, 1]], why: `${FOOD[id].porcao}: ~${FOOD[id].k} kcal`}))};
  }
  if (!list.length) {
    const base = MEAL[m].presets;
    let combos;
    if (m === "almoco") combos = [["frango", "frango grelhado"], ["hamb", "hambúrguer caseiro"], ["carne", "carne moída ao molho"]].map(([id]) => base[0].itens.concat([[id, 1]]));
    else combos = base.slice(0, 3).map(p => p.itens);
    const tt = it => totalsOf(it.map(([id, q]) => ({id, q})));
    combos = combos.map(it => (semPao || tt(it).k > t.kMax + 15 ? it.filter(([id]) => !FOOD[id].pao) : it));
    return {msg: t.adj > 0 || semPao ? "Hoje a meta está menor. Estas opções já cabem nela." : "Comece por um prato pronto ou monte com os cards abaixo.",
      opts: combos.map(it => { const x = tt(it); return {itens: it, why: `~${n0(x.k)} kcal e ${n0(x.p)} g de proteína`}; })};
  }
  const pNeed = t.pMin - tot.p, kNeed = t.kMin - tot.k, room = t.kMax - tot.k;
  if (room < -15) return {msg: null, opts: []};
  if (pNeed <= 0.5 && kNeed <= 60) return {msg: null, opts: []};
  const weekEggs = eggsInWeek(k, m) + list.filter(i => i.id === "ovo").reduce((a, i) => a + i.q, 0);
  const cand = MEAL[m].pref.filter(id => {
    const f = FOOD[id]; if (!f || f.g === "doce" || f.g === "oak" || f.g === "extra" || f.g === "fora") return false;
    if (id === "ovo" && weekEggs >= EGGS_WEEK) return false;
    if (f.suco || f.k === 0) return false;
    if (semPao && f.pao) return false;
    if (id === "whey" && list.some(i => i.id === "whey")) return false;
    if (id === "macarrao" && list.some(i => i.id === "arroz")) return false;
    if (id === "arroz" && list.some(i => i.id === "macarrao")) return false;
    const inPlate = list.find(i => i.id === id);
    if (inPlate && f.maxQ && inPlate.q >= f.maxQ) return false;
    return true;
  });
  const mid = (t.kMin + t.kMax) / 2, opts = [];
  const rank = id => MEAL[m].pref.indexOf(id);
  const push = (itens, bonus) => {
    let ak = 0, ap = 0;
    for (const [id, q] of itens) { ak += FOOD[id].k * q; ap += FOOD[id].p * q; }
    if (itens.some(([id, q]) => id === "ovo" && weekEggs + q > EGGS_WEEK)) return;
    const nk = tot.k + ak, np = tot.p + ap;
    const valid = nk <= t.kMax + 15 && (pNeed <= 0.5 || np >= t.pMin) && nk >= t.kMin - 100;
    let score = Math.abs(nk - mid) / 40 + (itens.length - 1) * 1.2 + itens.reduce((a, [id]) => a + rank(id), 0) / itens.length * 0.12;
    if (pNeed <= 0.5 && itens.every(([id]) => FOOD[id].g === "fruta")) score -= 0.8;
    if (itens.some(([id]) => FOOD[id].g === "fruta" && id !== "molho")) score -= 0.6;
    score += itens.reduce((a, [id, q]) => a + ((FOOD[id].maxQ || 2) >= 4 ? 0 : Math.max(0, q - 1) * 1.0), 0);
    if (bonus) score -= bonus;
    opts.push({itens, ak, ap, nk, np, valid, score});
  };
  for (const pr of MEAL[m].presets) {
    if (!pr.itens.some(([id]) => list.some(i => i.id === id))) continue;
    const rest = pr.itens.map(([id, q]) => { const inP = list.find(i => i.id === id); return [id, Math.round((q - (inP ? inP.q : 0)) * 10) / 10]; }).filter(([id, q]) => q > 0 && !(semPao && FOOD[id].pao));
    if (rest.length && rest.length <= 3) push(rest, 1.4);
  }
  for (const id of cand) {
    const f = FOOD[id], inP = list.find(i => i.id === id), maxQ = (f.maxQ || 2) - (inP && f.maxQ ? inP.q : 0);
    for (let q = 1; q <= maxQ; q++) push([[id, q]]);
    if (f.step === 0.5) push([[id, 0.5]]);
  }
  const top = cand.slice(0, 12);
  for (let i = 0; i < top.length; i++) for (let j = i + 1; j < top.length; j++) {
    if (FOOD[top[i]].g === FOOD[top[j]].g) continue;
    push([[top[i], 1], [top[j], 1]]);
  }
  let good = opts.filter(o => o.valid).sort((a, b) => a.score - b.score);
  let fallback = false;
  if (!good.length) {
    fallback = true;
    good = opts.filter(o => o.nk <= t.kMax + 15).sort((a, b) => (b.np - a.np) || (a.score - b.score));
  }
  const picked = [];
  const keyIds = o => o.itens.map(([id]) => id).filter(id => FOOD[id].g !== "fruta");
  for (const o of good) {
    const ks = keyIds(o);
    if (picked.some(pk => keyIds(pk).some(id => ks.includes(id)) || (ks.length === 0 && keyIds(pk).length === 0))) continue;
    picked.push(o);
    if (picked.length === 3) break;
  }
  const faltaP = Math.max(0, Math.ceil(pNeed)), faltaK = Math.max(0, Math.round(kNeed / 10) * 10);
  let msg;
  if (faltaP > 0 && faltaK > 60) msg = `Falta pelo menos ${faltaP} g de proteína e ~${faltaK} kcal.`;
  else if (faltaP > 0) msg = `Falta pelo menos ${faltaP} g de proteína.`;
  else msg = `Falta ~${faltaK} kcal para fechar a refeição.`;
  if (fallback) msg += " Estas opções chegam o mais perto possível.";
  return {msg, opts: picked.map(o => ({itens: o.itens, why: pNeed > 0.5 ? `+${n0(o.ap)} g de proteína, +${n0(o.ak)} kcal` : `+${n0(o.ak)} kcal`}))};
}
const itensTxt = itens => itens.map(([id, q]) => (q === 1 ? FOOD[id].nome : `${FOOD[id].nome} × ${qtyTxt(q)}`)).join(" + ");

/* ---------- plano de treino (15 dias) ---------- */
function training(k) {
  const idx = diffDays(data.start, k), wd = weekday(k);
  if (idx < 0) return {txt: "O plano ainda não começou", det: `Começa em ${fmtShort(data.start)}.`, rest: true, idx};
  const w1 = idx < 7;
  const map = {
    1: `Musculação A + ${w1 ? 15 : 20} min de cardio`,
    2: `Cardio ${w1 ? 45 : 60} min`,
    3: "Beach tennis",
    4: `Musculação B + ${w1 ? 15 : 20} min de cardio`,
    5: `Cardio ${w1 ? 45 : 60} min`
  };
  const txt = map[wd] || "Descanso";
  const rest = !map[wd];
  let det = rest ? "Aproveite. A caminhada depois das refeições continua valendo." :
    (wd === 3 ? "Conta como cardio. Beba água nas pausas." : "Cardio no ritmo de conversa: fala frases, mas não canta (107–127 batimentos).");
  if (idx === 14) det = "Dia 15: pesar, medir a cintura e revisar o plano com o personal. " + det;
  return {txt, det, rest, idx};
}

function snapshot(k) { undoSnap = {k, day: JSON.parse(JSON.stringify(dayObj(k)))}; }

function addItems(k, m, itens, label) {
  snapshot(k);

  for (const [id, q] of itens) {

    const it = list.find(i => i.id === id);

function changeQty(k, m, id, dir) {

  h += `<div class="cats">${cats.map(([c, l]) => `<button class="${ui.cat === c && !ui.q.trim() ? "on" : ""}" data-a="cat" data-c="${c}">${esc(l)}</button>`).join("")}</div>`;

function weightChart(ws) {
  if (ws.length < 1) return `<div class="muted small">O gráfico aparece depois da primeira pesagem.</div>`;
  const W = 340, H = 190, L = 40, R = 14, TOP = 14, B = 30;
  const xs = ws.map(w => dateOf(w.date).getTime()), ys = ws.map(w => w.kg);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.floor(Math.min(...ys) - 1), y1 = Math.ceil(Math.max(...ys) + 1);
  const X = x => x1 === x0 ? (L + W - R) / 2 : L + (x - x0) / (x1 - x0) * (W - L - R);
  const Y = y => TOP + (y1 - y) / (y1 - y0) * (H - TOP - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Curva de peso">`;
  const step = Math.max(1, Math.round((y1 - y0) / 4));
  for (let y = y0; y <= y1; y += step) s += `<line x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(y) + 4}" font-size="11" text-anchor="end" fill="var(--soft)">${y}</text>`;
  s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${ws.map(w => `${X(dateOf(w.date).getTime())},${Y(w.kg)}`).join(" ")}"/>`;
  ws.forEach(w => { s += `<circle cx="${X(dateOf(w.date).getTime())}" cy="${Y(w.kg)}" r="4.5" fill="var(--accent)"/>`; });
  s += `<text x="${L}" y="${H - 8}" font-size="11" fill="var(--soft)">${fmtShort(ws[0].date)}</text>`;
  if (ws.length > 1) s += `<text x="${W - R}" y="${H - 8}" font-size="11" text-anchor="end" fill="var(--soft)">${fmtShort(ws[ws.length - 1].date)}</text>`;
  return s + `</svg>`;
}

function weekSummary(k) {
  const days = weekDays(k), today = todayKey();
  let treinos = 0, treinosPlan = 0, verdes = 0, lancadas = 0, ovos = 0;
  for (const dk of days) {
    if (dk > today) continue;
    const tr = training(dk);
    if (!tr.rest && tr.idx >= 0) { treinosPlan++; if (data.days[dk] && data.days[dk].treino) treinos++; }
    const T = targets(dk);
    for (const m of MEALS) {
      if (!items(dk, m.id).length) continue;
      lancadas++; if (status(dk, m.id, T).s === "ok") verdes++;
    }
  }
  ovos = eggsInWeek(k);
  const ws = data.weights.filter(w => w.date >= days[0] && w.date <= days[6]).sort((a, b) => a.date < b.date ? -1 : 1);
  return {days, treinos, treinosPlan, verdes, lancadas, ovos, oak: oakInWeek(k), peso: ws.length ? ws[ws.length - 1] : null};
}

function render(passive) {
  const app = document.getElementById("app");
  const y = window.scrollY;
  // redesenho que ele não pediu (virada do dia, outra aba): mantém o que ele digitou e ainda não salvou
  const typed = passive ? [...app.querySelectorAll("input[id]")].filter(i => i.type !== "file" && i.value !== i.defaultValue).map(i => [i.id, i.value]) : [];
  let main = "";
  if (ui.view === "hoje") main = viewHoje();
  else if (ui.view === "refeicao") main = viewMeal();
  else if (ui.view === "peso") main = viewPeso();
  else if (ui.view === "semana") main = viewSemana();
  else if (ui.view === "porque") main = viewPorque();
  const tab = v => (ui.view === v || (v === "hoje" && ui.view === "refeicao")) ? "on" : "";
  app.innerHTML = `
    <header class="top"><h1>Meu Plano</h1><button class="help-btn" data-a="help">Não estou bem</button></header>
    <main class="wrap">${main}</main>
    <nav class="tabs"><div class="in">
      <button class="${tab("hoje")}" data-a="go" data-v="hoje"><span>🏠</span>Hoje</button>
      <button class="${tab("peso")}" data-a="go" data-v="peso"><span>⚖️</span>Peso</button>
      <button class="${tab("semana")}" data-a="go" data-v="semana"><span>📅</span>Semana</button>
      <button class="${tab("porque")}" data-a="go" data-v="porque"><span>💡</span>Por quê?</button>
    </div></nav>
    ${ui.toast ? `<div class="toast" role="status"><span>${esc(ui.toast.msg)}</span>${ui.toast.undo && undoSnap ? `<button data-a="undo">Desfazer</button>` : ""}</div>` : ""}
    ${ui.onb ? viewOnb() : viewModal()}`;
  for (const [id, v] of typed) { const el = document.getElementById(id); if (el) el.value = v; }
  const where = ui.view + "|" + (ui.meal || "") + "|" + ui.day;
  if (where !== lastWhere) window.scrollTo(0, 0); else window.scrollTo(0, y);
  lastWhere = where;
  const imp = document.getElementById("imp");
  if (imp) imp.addEventListener("change", onImport);
  const busca = document.getElementById("busca");
  if (busca) busca.addEventListener("input", onBusca);
  // a aba escolhida fica à vista na fileira de abas
  const catOn = document.querySelector(".cats button.on");
  if (catOn) catOn.parentElement.scrollLeft = Math.max(0, catOn.offsetLeft - catOn.parentElement.offsetLeft - 16);
  bindDrag();
}

}

/* ---------- arrastar (computador) ---------- */
function bindFoodDrag() { document.querySelectorAll(".food[draggable]").forEach(el => el.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", el.dataset.id))); }
function bindDrag() {
  const plate = document.getElementById("plate"); if (!plate) return;
  bindFoodDrag();
  plate.addEventListener("dragover", e => { e.preventDefault(); plate.classList.add("drag"); });
  plate.addEventListener("dragleave", () => plate.classList.remove("drag"));
  plate.addEventListener("drop", e => {
    e.preventDefault(); plate.classList.remove("drag");
    const id = e.dataTransfer.getData("text/plain");
    if (FOOD[id]) { addItems(ui.day, ui.meal, [[id, FOOD[id].step === 0.5 ? 1 : 1]]); ui.keepScroll = true; render(); }
  });
}

/* ---------- cliques ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, k = ui.day;
  if (a === "modal-bg" && e.target !== el) return;
  switch (a) {
    case "go": ui.view = el.dataset.v; ui.meal = null; ui.q = ""; break;
    case "day": { const n = Number(el.dataset.n), nk = addDays(k, n); if (nk <= todayKey()) ui.day = nk; break; }
    case "open": ui.meal = el.dataset.m; ui.view = "refeicao"; ui.cat = "comuns"; ui.q = ""; break;
    case "oak-size": setOakSize(k, el.dataset.id); ui.keepScroll = true; break;
    case "oak-size-500": ui.modal = null; setOakSize(k, "oak500"); ui.keepScroll = true; break;
    case "oak-size-720": ui.modal = null; setOakSize(k, "oak720", true); ui.keepScroll = true; break;
    case "oak-top": toggleOakTop(k, el.dataset.id); ui.keepScroll = true; break;
    case "repeat-yday": { const it = copyItens(addDays(k, -1), k, ui.meal); if (it.length) addItems(k, ui.meal, it, `${MEAL[ui.meal].nome.toLowerCase()} ${k === todayKey() ? "de ontem" : "do dia anterior"}`); ui.keepScroll = true; break; }
    case "copy-open": ui.modal = copyModal(k, ui.meal); ui.keepScroll = true; break;
    case "copy-day": { const src = el.dataset.d, it = copyItens(src, k, ui.meal); ui.modal = null; if (it.length) addItems(k, ui.meal, it, `${MEAL[ui.meal].nome.toLowerCase()} de ${fmtShort(src)}`); ui.keepScroll = true; break; }
    case "onb-next": ui.onb.step++; break;
    case "onb-fim": { const v = (document.getElementById("onbdate") || {}).value; if (v) data.start = v; setCfg({onboarded: true}); save(); ui.onb = null; break; }
    case "tog": { snapshot(k); const d = dayObj(k, true); d[el.dataset.f] = !d[el.dataset.f]; save(); ui.keepScroll = true; break; }
    case "oak": setOak(k, el.dataset.on === "1"); ui.keepScroll = true; break;
    case "oak-force": ui.modal = null; setOak(k, true, true); ui.keepScroll = true; break;
    case "add": { const f = FOOD[el.dataset.id]; addItems(k, ui.meal, [[f.id, 1]]); ui.keepScroll = true; break; }
    case "q": changeQty(k, ui.meal, el.dataset.id, Number(el.dataset.n)); ui.keepScroll = true; break;
    case "sug": { const sg = suggestions(k, ui.meal), o = sg.opts[Number(el.dataset.i)]; if (o) addItems(k, ui.meal, o.itens); ui.keepScroll = true; break; }
    case "preset": { const d = dayObj(k); const ps = (d.type === "oak" && ui.meal === "lanche") ? [OAK_PRESET] : MEAL[ui.meal].presets; const p = ps[Number(el.dataset.i)]; if (p) addItems(k, ui.meal, p.itens, p.nome); ui.keepScroll = true; break; }
    case "cat": ui.cat = el.dataset.c; ui.q = ""; ui.keepScroll = true; break;
    case "undo": if (undoSnap) { data.days[undoSnap.k] = undoSnap.day; undoSnap = null; save(); ui.toast = null; } ui.keepScroll = true; break;
    case "help": helpModal(); ui.keepScroll = true; break;
    case "call192": location.href = "tel:192"; break;
    case "modal-close": case "modal-bg": ui.modal = null; ui.keepScroll = true; break;
    case "banner-off": ui.bannerOff = true; ui.keepScroll = true; break;
    case "save-w": {
      const kg = parseFloat((document.getElementById("kg").value || "").replace(",", "."));
      const cm = parseFloat((document.getElementById("cm").value || "").replace(",", "."));
      const date = document.getElementById("wd").value || todayKey();
      if (!(kg > 30 && kg < 300)) { toast("Digite o peso em kg, por exemplo 99,5."); break; }
      data.weights = data.weights.filter(w => w.date !== date);
      data.weights.push({date, kg: Math.round(kg * 10) / 10, cm: cm > 40 && cm < 250 ? Math.round(cm * 10) / 10 : null});
      save(); toast("Pesagem salva.");
      break;
    }
    case "del-w": data.weights = data.weights.filter(w => w.date !== el.dataset.d); save(); ui.keepScroll = true; break;
    case "copy": { const txt = summaryText(weekSummary(k)); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { toast("Resumo copiado."); render(); }, () => { toast("Não deu para copiar neste aparelho."); render(); }); return; }
    case "export": exportData(); return;
    case "save-start": { const v = document.getElementById("st").value; if (v) { data.start = v; save(); toast("Data de início salva."); } break; }
    case "reset": ui.modal = {title: "Apagar tudo?", body: "<p>Todos os registros deste celular serão apagados. Isso não tem volta. Se quiser, salve uma cópia antes na tela Semana.</p>", actions: [{label: "Cancelar", a: "modal-close", primary: true}, {label: "Apagar tudo", a: "reset-yes", danger: true}]}; ui.keepScroll = true; break;
    case "reset-yes": data = blank(); save(); ui.modal = null; ui.view = "hoje"; ui.day = todayKey(); toast("Registros apagados."); break;
    default: return;
  }
  render();
});

/* ---------- cópia de segurança ---------- */
function exportData() {
  const name = `meu-plano-copia-${todayKey()}.json`;
  const blob = new Blob([JSON.stringify(data, null, 1)], {type: "application/json"});
  try {
    const file = new File([blob], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      navigator.share({files: [file], title: "Cópia do Meu Plano"}).then(() => { markBackup(); toast("Cópia salva."); render(); }).catch(() => {});
      return;
    }
  } catch (e) {}
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  markBackup();
  toast("Cópia salva."); render();
}
function markBackup() { setCfg({lastBackup: todayKey()}); save(); }
function onImport(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || d.version !== VERSION || typeof d.days !== "object") throw new Error("formato");
      ui.modal = {title: "Restaurar esta cópia?", body: `<p>Os registros atuais deste celular serão trocados pelos da cópia (${Object.keys(d.days).length} dias, ${Array.isArray(d.weights) ? d.weights.length : 0} pesagens).</p>`,
        actions: [{label: "Restaurar", a: "import-yes", primary: true}, {label: "Cancelar", a: "modal-close"}]};
      pendingImport = d;
    } catch (err) { toast("Esse arquivo não é uma cópia do Meu Plano."); }
    render();
  };
  r.readAsText(f);
}
let pendingImport = null;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a='import-yes']"); if (!el || !pendingImport) return;
  data = pendingImport; data.weights = Array.isArray(data.weights) ? data.weights : []; pendingImport = null; save();
  ui.modal = null; toast("Cópia restaurada."); render();
});

/* ---------- início ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
/* virada do dia: se o app ficou aberto (ou volta do fundo) depois da meia-noite, "Hoje" passa para o dia novo */
function checkNewDay() {
  const t = todayKey();
  if (t === lastToday) return;
  const eraHoje = ui.day === lastToday;
  lastToday = t;
  if (eraHoje) { ui.day = t; ui.modal = null; if (ui.view === "refeicao") { ui.view = "hoje"; ui.meal = null; ui.q = ""; } }
  render(true);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNewDay(); });
window.addEventListener("focus", checkNewDay);
window.addEventListener("pageshow", checkNewDay);
setInterval(checkNewDay, 60000);
/* outra aba ou janela do app salvou: recarrega para uma não apagar o que a outra gravou */
window.addEventListener("storage", e => { if (e.key === STORE_KEY) { data = load(); render(true); } });

if (!cfg().onboarded && !Object.keys(data.days).length && !data.weights.length) ui.onb = {step: 0};
window.MeuPlano = {data: () => data, targets, suggestions, status, dayTotals, totalsOf, FOOD, MEALS};
render();
</script>
</body>
</html>
